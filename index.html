 aria-label="状态"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select></label></div><div class="inline-input" id="new-status-row" hidden><input id="new-status-name" maxlength="30" placeholder="输入新状态名称" aria-label="新状态名称"><button type="button" id="add-status" class="secondary">添加状态</button></div><details class="task-details" hidden><summary>更多信息</summary><label>截止日期 <span class="optional">可选</span><input id="due" type="date" min="1900-01-01" max="9999-12-31"></label></details><div class="dialog-actions"><button type="button" id="delete" class="danger">删除事项</button><div><button type="button" id="cancel" class="secondary">取消</button><button type="submit" class="primary">保存事项</button></div></div></form></dialog>

iv class="dialog-actions"><div><button type="button" id="board-cancel" class="secondary">取消</button><button class="primary" type="submit">保存看板</button></div></div></form></dialog><input type="file" id="import-file" accept=".json,application/json" hidden><div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo" hidden>撤销</button></div>
